[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quant-research-agent"
version = "0.1.0"
description = "Evidence-first, research-only BTC daily strategy discovery and validation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
quant-agent = "quant_research_agent.cli:main"
quant-ideas = "quant_research_agent.idea_funnel:main"
quant-funding = "quant_research_agent.funding_audit:main"
quant-funding-kill = "quant_research_agent.funding_mechanism:main"
quant-attention-kill = "quant_research_agent.attention_kill_test:main"
quant-orchestrator = "quant_research_agent.orchestrator:main"
quant-research-loop = "quant_research_agent.autonomous_loop:main"
quant-mechanism = "quant_research_agent.mechanism_discovery:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
